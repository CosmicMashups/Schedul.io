spring:
  application:
    name: clinic-platform

  datasource:
    # DB_SSL_PARAMS is empty for local/plain-Postgres dev; set it to "?sslmode=require" (Supabase,
    # Neon, most managed Postgres) via env var in hosted environments — see backend/README.md.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clinic_platform}${DB_SSL_PARAMS:}
    username: ${DB_USER:clinic}
    password: ${DB_PASSWORD:clinic}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: clinic-platform
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.clinic.platform.*"

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

clinic:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-in-production-32-bytes-minimum-secret-key}
      access-token-ttl-minutes: 30
      refresh-token-ttl-days: 14
    public-paths:
      - /api/v1/auth/**
      - /api/v1/doctors/**
      - /api/v1/services/**
      - /api/v1/availability
      - /actuator/health/**
      - /swagger-ui/**
      - /v3/api-docs/**
      # NOTE: still tenant-scoped via X-Tenant-Id — "public" here means no login required,
      # not cross-tenant. Availability/booking endpoints join this list in Milestone 3/4.
  tenant:
    header-name: X-Tenant-Id
    default-tenant-strategy: HEADER   # HEADER | SUBDOMAIN | JWT_CLAIM
  scheduling:
    horizon-days: 90                       # section 11: rolling horizon, not pre-generated years
    horizon-job-cron: "0 0 1 * * *"         # nightly at 1am — extends the horizon by one day
    hold-duration-seconds: 300              # section 12: 5-minute slot hold
    hold-sweep-interval-ms: 30000           # how often expired holds are released back to FREE

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.clinic.platform: INFO
    org.hibernate.SQL: WARN
